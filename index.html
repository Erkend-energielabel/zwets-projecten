<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5c4a">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zwets">
<title>Zwets Projecten</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5c4a'/%3E%3Crect x='7' y='9' width='18' height='8' rx='2' fill='%23c98b1b'/%3E%3Crect x='14' y='17' width='4' height='9' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: één kolom werkbank; projectlijst → projectdetail met tabbladen; cijfers als verfstalen */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1d2a26; --muted:#5f6d68; --line:#d9ddd8;
  --accent:#1f5c4a; --accent-ink:#ffffff; --ochre:#c98b1b; --good:#2f7d4f; --bad:#b23a2b; --chip:#e7ebe6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1b2320; --ink:#e6ece9; --muted:#9aa8a2; --line:#2e3a36;
  --accent:#5fb596; --accent-ink:#0d1a15; --ochre:#e0a83f; --good:#6cc28f; --bad:#ec7a6a; --chip:#25302c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1b2320; --ink:#e6ece9; --muted:#9aa8a2; --line:#2e3a36;
  --accent:#5fb596; --accent-ink:#0d1a15; --ochre:#e0a83f; --good:#6cc28f; --bad:#ec7a6a; --chip:#25302c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.7rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.strip{display:flex;gap:3px;margin-bottom:6px}
.strip i{width:18px;height:6px;border-radius:2px;display:block}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
button.danger{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.plist{display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;cursor:pointer;text-align:left;width:100%;font-weight:400}
.pcard:hover{border-color:var(--accent)}
.pcard .meta{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.bar{grid-column:1/-1;height:8px;background:var(--chip);border-radius:4px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--chip);white-space:nowrap}
.pill.good{color:var(--good)} .pill.bad{color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:none;background:none;border-bottom:3px solid transparent;border-radius:0;padding:10px 12px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ochre)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sw,var(--line))}
.kpi b{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.calc{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.calc .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.calc .row:last-child{border-bottom:none;font-weight:600}
.tbl{overflow-x:auto;min-width:0;max-width:100%}
.wrap>*,.panel>*{min-width:0}
.panel{min-width:0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;border-bottom:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:20;max-width:90vw}
.share{display:flex;align-items:center;gap:8px}
.share .sbar{flex:1;height:6px;background:var(--chip);border-radius:3px;overflow:hidden;min-width:40px}
.share .sbar span{display:block;height:100%;background:var(--ochre)}
.crumb{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:-8px}
.crumb>button.ghost{padding-left:0}
.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi b{overflow-wrap:anywhere}
.stepper{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepper input{max-width:110px;text-align:center}
.stepper button{min-width:52px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.2}
.seg button small{font-weight:500;opacity:.8}
@media (max-width:560px){
  .kpis{grid-template-columns:1fr;gap:6px}
  .kpi{flex-direction:row;justify-content:space-between;align-items:baseline;padding:10px 14px 10px 16px}
  .kpi b{font-size:1.1rem}
  table{font-size:.85rem}
  .panel{padding:14px 12px}
  .hide-m{display:none}
  th,td{padding:8px 4px}
  h1{font-size:1.45rem}
}
.note{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.pcard,button{transition:border-color .15s,background .15s}}
.who{display:flex;gap:4px 10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;font-size:.85rem;color:var(--muted)}
.who button.ghost{padding:4px 6px;font-size:.85rem}
.who:empty{display:none}
body.busy{cursor:progress}
body.busy button[type=submit]{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <div id="who" class="who"></div>
  <div id="crumb" class="crumb" hidden></div>
  <header class="top">
    <div class="brand">
      <div class="strip" aria-hidden="true"><i style="background:#1f5c4a"></i><i style="background:#c98b1b"></i><i style="background:#b23a2b"></i><i style="background:#8aa6b8"></i><i style="background:#e8e2d0"></i></div>
      <span class="lbl">Zwets Schilderwerken B.V.</span>
      <h1 id="pageTitle">Projecten</h1>
    </div>
    <div id="topActions" class="row-actions"></div>
  </header>
  <main id="app" class="wrap" style="gap:16px"></main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="config.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
